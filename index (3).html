<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>블로그 ➔ 스마트폰 교재 자동 변환기</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        
        /* Markdown Styles */
        .prose h1 { font-size: 1.75rem; font-weight: 700; color: #1e293b; margin-top: 1.5rem; margin-bottom: 1rem; border-bottom: 2px solid #e2e8f0; padding-bottom: 0.5rem; }
        .prose h2 { font-size: 1.5rem; font-weight: 700; color: #334155; margin-top: 1.5rem; margin-bottom: 0.75rem; }
        .prose h3 { font-size: 1.25rem; font-weight: 600; color: #475569; margin-top: 1.25rem; margin-bottom: 0.5rem; }
        .prose p { margin-bottom: 1rem; line-height: 1.7; color: #334155; }
        .prose ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 1rem; }
        .prose ol { list-style-type: decimal; padding-left: 1.5rem; margin-bottom: 1rem; }
        .prose li { margin-bottom: 0.25rem; }
        .prose strong { color: #0f172a; font-weight: 700; }
        .prose blockquote { border-left: 4px solid #cbd5e1; padding-left: 1rem; color: #64748b; font-style: italic; margin-bottom: 1rem; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 flex flex-col">

    <!-- Header -->
    <header class="w-full bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-blue-600 text-white p-2 rounded-lg shadow-sm">
                    <i class="fa-solid fa-book-journal-whills text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-slate-900">EduText Converter</h1>
                    <p class="text-xs text-slate-500">블로그 글을 완벽한 교재 형식으로</p>
                </div>
            </div>
            <div>
                <button onclick="clearAll()" class="text-sm font-medium text-slate-500 hover:text-slate-800 px-3 py-2 rounded-md hover:bg-slate-100 transition-colors">
                    <i class="fa-solid fa-rotate-right mr-1"></i>초기화
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full flex flex-col lg:flex-row gap-6">
        
        <!-- Left: Input Section -->
        <section class="w-full lg:w-1/2 flex flex-col space-y-4">
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 flex-grow flex flex-col">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-bold text-slate-800 flex items-center">
                        <i class="fa-brands fa-blogger text-orange-500 mr-2"></i>블로그 원문 입력
                    </h2>
                    <span class="text-xs font-medium bg-slate-100 text-slate-500 px-2 py-1 rounded">입력창</span>
                </div>
                <p class="text-sm text-slate-500 mb-3">변환하고 싶은 블로그 포스팅의 전체 내용을 아래에 붙여넣어 주세요.</p>
                <textarea id="blog-input" class="w-full flex-grow p-4 border border-slate-200 rounded-xl bg-slate-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 transition-colors resize-none text-sm leading-relaxed" placeholder="여기에 블로그 텍스트를 붙여넣으세요..."></textarea>
            </div>
            
            <button id="convert-btn" onclick="convertText()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl shadow-md transition-all flex justify-center items-center space-x-2 group">
                <i class="fa-solid fa-wand-magic-sparkles group-hover:animate-pulse"></i>
                <span>스마트폰 교재 형식으로 변환하기</span>
            </button>
        </section>

        <!-- Right: Output Section -->
        <section class="w-full lg:w-1/2 flex flex-col space-y-4">
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 flex-grow flex flex-col relative overflow-hidden">
                
                <!-- Loading Overlay -->
                <div id="loading-overlay" class="absolute inset-0 bg-white/90 backdrop-blur-sm z-10 hidden flex-col justify-center items-center">
                    <div class="animate-spin rounded-full h-12 w-12 border-4 border-blue-100 border-t-blue-600 mb-4"></div>
                    <p class="text-blue-800 font-medium">AI가 교재를 편성하고 있습니다...</p>
                    <p class="text-xs text-slate-500 mt-2">수초 정도 소요될 수 있습니다.</p>
                </div>

                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-bold text-slate-800 flex items-center">
                        <i class="fa-solid fa-file-contract text-blue-600 mr-2"></i>교재 변환 결과
                    </h2>
                    <button onclick="copyResult()" id="copy-btn" class="hidden items-center space-x-1 text-sm font-medium bg-blue-50 text-blue-700 hover:bg-blue-100 px-3 py-1.5 rounded-lg transition-colors">
                        <i class="fa-regular fa-copy"></i>
                        <span>복사하기</span>
                    </button>
                </div>
                
                <!-- Output Content Area -->
                <div id="output-area" class="w-full flex-grow p-6 border border-slate-200 rounded-xl bg-white overflow-y-auto prose max-w-none">
                    <div class="h-full flex flex-col items-center justify-center text-slate-400 space-y-3">
                        <i class="fa-solid fa-file-signature text-4xl opacity-50"></i>
                        <p class="text-sm">변환하기 버튼을 누르면 이곳에 교재 양식이 나타납니다.</p>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <!-- Custom Toast Alert -->
    <div id="toast" class="fixed bottom-5 left-1/2 transform -translate-x-1/2 translate-y-20 opacity-0 transition-all duration-300 bg-slate-800 text-white px-6 py-3 rounded-full shadow-lg z-50 flex items-center space-x-2 text-sm pointer-events-none">
        <i class="fa-solid fa-circle-info text-blue-400" id="toast-icon"></i>
        <span id="toast-message">알림 메시지</span>
    </div>

    <script>
        let toastTimer;

        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-message');
            const toastIcon = document.getElementById('toast-icon');

            toastMsg.textContent = message;
            
            if(type === 'success') {
                toastIcon.className = "fa-solid fa-circle-check text-green-400";
            } else if (type === 'error') {
                toastIcon.className = "fa-solid fa-circle-exclamation text-red-400";
            } else {
                toastIcon.className = "fa-solid fa-circle-info text-blue-400";
            }

            toast.classList.remove('translate-y-20', 'opacity-0');
            
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        function clearAll() {
            document.getElementById('blog-input').value = '';
            const outputArea = document.getElementById('output-area');
            outputArea.innerHTML = `
                <div class="h-full flex flex-col items-center justify-center text-slate-400 space-y-3">
                    <i class="fa-solid fa-file-signature text-4xl opacity-50"></i>
                    <p class="text-sm">변환하기 버튼을 누르면 이곳에 교재 양식이 나타납니다.</p>
                </div>
            `;
            document.getElementById('copy-btn').classList.add('hidden');
            document.getElementById('copy-btn').classList.remove('flex');
            showToast('초기화되었습니다.', 'info');
        }

        async function copyResult() {
            const outputArea = document.getElementById('output-area');
            // We want to copy the rendered text, or the markdown. 
            // For a better user experience pasting into Google Docs, copying the parsed HTML (as rich text) is ideal, 
            // but standard execCommand is safer for iframes.
            
            try {
                // Create a temporary element to hold the text format
                const tempDiv = document.createElement("div");
                tempDiv.innerHTML = outputArea.innerHTML;
                document.body.appendChild(tempDiv);
                
                // Select the text
                const range = document.createRange();
                range.selectNodeContents(tempDiv);
                const selection = window.getSelection();
                selection.removeAllRanges();
                selection.addRange(range);
                
                // Execute copy
                document.execCommand('copy');
                
                // Cleanup
                selection.removeAllRanges();
                document.body.removeChild(tempDiv);

                showToast('교재 내용이 클립보드에 복사되었습니다. 워드나 구글 문서에 붙여넣기 해보세요!', 'success');
            } catch (err) {
                showToast('복사에 실패했습니다. 브라우저 설정을 확인해주세요.', 'error');
            }
        }

        async function convertText() {
            const inputText = document.getElementById('blog-input').value.trim();
            if (!inputText) {
                showToast('변환할 블로그 글을 먼저 입력해주세요.', 'error');
                return;
            }

            const loadingOverlay = document.getElementById('loading-overlay');
            const outputArea = document.getElementById('output-area');
            const copyBtn = document.getElementById('copy-btn');
            const convertBtn = document.getElementById('convert-btn');

            // UI State change
            loadingOverlay.classList.remove('hidden');
            loadingOverlay.classList.add('flex');
            convertBtn.disabled = true;
            convertBtn.classList.add('opacity-75', 'cursor-not-allowed');

            const systemPrompt = `
당신은 시니어 및 스마트폰 초보자를 위한 IT/스마트폰 활용 교육 전문 교재 편집자입니다.
사용자가 입력하는 블로그 포스팅 원문을 분석하여, 교육 현장에서 바로 배포할 수 있는 '교재(Textbook)' 형식으로 완벽하게 재구성해 주십시오.

[변환 지침]
1. 어조 및 문체: 
   - 블로그 특유의 가벼운 말투, 사담, 인사말, 이모티콘은 모두 제거합니다.
   - 매우 정중하고 격식 있는 교재용 경어체(하십시오체, 합니다체)를 사용합니다.
   - 예: "~했어요", "~인거 같아요" -> "~습니다.", "~합니다."

2. 문서 구조 (반드시 다음 구조를 따를 것):
   # [단원 제목] (원문 내용을 바탕으로 명확한 학습 주제를 제목으로 선정)
   
   ## 1. 학습 목표
   - (이 단원을 통해 학습자가 얻게 될 지식 1~2줄 요약)

   ## 2. 주요 개념 이해
   - (원문에 있는 핵심 개념을 알기 쉽게 풀어서 설명)

   ## 3. 단계별 실습 가이드
   - (원문의 절차를 1, 2, 3 단계로 나누어 행동 지시어 형태로 작성. 예: "1. 우측 상단의 [설정] 아이콘을 누릅니다.")

   ## 4. 요약 및 마무리
   - (핵심 내용 한 줄 요약 및 격려의 말)

3. 포맷팅:
   - 마크다운(Markdown) 문법을 사용하여 제목, 글머리 기호, 굵은 글씨 등을 명확하게 표현해 주십시오.
`;

            const payload = {
                contents: [{ parts: [{ text: inputText }] }],
                systemInstruction: { parts: [{ text: systemPrompt }] }
            };

            const apiKey = ""; // Leave empty for Canvas provided key
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    throw new Error(`API Request failed with status ${response.status}`);
                }

                const result = await response.json();
                const candidate = result.candidates?.[0];

                if (candidate && candidate.content?.parts?.[0]?.text) {
                    let markdownText = candidate.content.parts[0].text;
                    
                    // Parse Markdown to HTML
                    const htmlContent = marked.parse(markdownText);
                    
                    // Display Result
                    outputArea.innerHTML = htmlContent;
                    
                    // Show Copy Button
                    copyBtn.classList.remove('hidden');
                    copyBtn.classList.add('flex');
                    
                    showToast('성공적으로 교재 형식으로 변환되었습니다!', 'success');
                } else {
                    throw new Error('응답 결과를 처리할 수 없습니다.');
                }

            } catch (error) {
                console.error("Conversion Error:", error);
                outputArea.innerHTML = `
                    <div class="h-full flex flex-col items-center justify-center text-red-500 space-y-3">
                        <i class="fa-solid fa-triangle-exclamation text-4xl"></i>
                        <p class="text-sm font-bold">변환 중 오류가 발생했습니다.</p>
                        <p class="text-xs text-slate-500 text-center max-w-xs">네트워크 연결을 확인하시거나 잠시 후 다시 시도해주세요.</p>
                    </div>
                `;
                showToast('변환 실패: 잠시 후 다시 시도해주세요.', 'error');
            } finally {
                // UI State restore
                loadingOverlay.classList.add('hidden');
                loadingOverlay.classList.remove('flex');
                convertBtn.disabled = false;
                convertBtn.classList.remove('opacity-75', 'cursor-not-allowed');
            }
        }
    </script>
</body>
</html>
